<!doctype html>
<html lang="th">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Happy Birthday</title>

  <link rel="stylesheet" href="css/style.css">
</head>

<body>

  <!-- ดาวหลังเป่าเทียน -->
  <div class="stars-layer" id="starsLayer"></div>

  <div class="container">

    <div class="shell">

      <!-- =========================
           TITLE
      ========================== -->
      <h2 id="titleText">
        เค้กมาส่งแล้ว
      </h2>


      <!-- =========================
           CAKE
      ========================== -->
      <div class="cake-stage">

        <div class="cake" id="cake">

          <div class="plate"></div>

          <div class="layer layer-bottom"></div>
          <div class="layer layer-middle"></div>
          <div class="layer layer-top"></div>

          <div class="icing"></div>

          <div class="drip drip1"></div>
          <div class="drip drip2"></div>
          <div class="drip drip3"></div>

          <!-- FIREWORK -->
          <div class="pyro" id="pyro">
            <div></div>
            <div></div>
          </div>

        </div>

      </div>


      <!-- =========================
           STEP 1
      ========================== -->
      <div class="big-card" id="step1">

        <p class="badge">
          คลิกบนเค้กเพื่อปักเทียน
        </p>

        <p class="subtle">
          ปักเทียนกี่เล่มก็ได้เลย
        </p>

      </div>


      <!-- =========================
           STEP 2
      ========================== -->
      <div class="big-card" id="step2" style="display:none;">

        <h2>
          เป่าเทียนวันเกิด
        </h2>

        <p class="subtle" id="msg">
          ปักเทียนแล้ว! กดอนุญาตไมโครโฟนเพื่อเป่า
        </p>

        <div class="button-area">

          <button
            class="btn"
            id="micBtn"
            type="button">
            อนุญาตให้ใช้ไมโครโฟน
          </button>

        </div>

      </div>


      <!-- =========================
           STEP 3
      ========================== -->
      <div class="big-card" id="step3" style="display:none;">

        <h2 id="hbText">
          Happy Birthday ♡
        </h2>

        <p class="subtle">
          สุขสันต์วันเกิดนะ ♡
        </p>

        <div class="button-area">

          <a
            class="btn secondary"
            href="pass.html"
            id="nextBtn">
            ถัดไป
          </a>

        </div>

      </div>

    </div>

  </div>


  <script src="js/cake.js"></script>

</body>

</html>
